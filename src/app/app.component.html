<mat-toolbar color="primary" class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand" aria-label="Ir al catálogo">
      <span class="brand-icon" aria-hidden="true">B.</span>
      <span><strong>UCPS Biblioteca</strong><small>Catálogo académico y reportabilidad</small></span>
    </a>
    <nav class="nav-links" aria-label="Navegación principal">
      <button mat-button routerLink="/" routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }">Catálogo</button>
      <button mat-button routerLink="/dashboard" routerLinkActive="active-link">Dashboard</button>
    </nav>
    <div class="top-right"><span class="tag">UNSA · Práctica 10</span></div>
  </div>
</mat-toolbar>
<main class="app-main"><router-outlet></router-outlet></main>
<footer class="app-footer"><span>Universidad Nacional de San Agustín · UCPS</span><span>Desarrollo de Aplicaciones Empresariales · 2026</span></footer>
