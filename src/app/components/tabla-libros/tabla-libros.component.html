<div class="table-scroll">
<table mat-table [dataSource]="libros" class="catalog-table" aria-label="Catálogo de libros">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>CÓDIGO</th>
    <td mat-cell *matCellDef="let libro"><span class="code">{{ libro.id }}</span></td>
  </ng-container>
  <ng-container matColumnDef="titulo">
    <th mat-header-cell *matHeaderCellDef>TÍTULO</th>
    <td mat-cell *matCellDef="let libro"><span class="book-title">{{ libro.titulo }}</span></td>
  </ng-container>
  <ng-container matColumnDef="categoria">
    <th mat-header-cell *matHeaderCellDef>CATEGORÍA</th>
    <td mat-cell *matCellDef="let libro"><span class="category-chip" [class.cat-redes]="libro.categoria === 'Redes'" [class.cat-bd]="libro.categoria === 'Bases de Datos'" [class.cat-ciencias]="libro.categoria === 'Ciencias Básicas'">{{ libro.categoria }}</span></td>
  </ng-container>
  <ng-container matColumnDef="autor">
    <th mat-header-cell *matHeaderCellDef>AUTOR</th>
    <td mat-cell *matCellDef="let libro"><span class="author">{{ libro.autor }}</span></td>
  </ng-container>
  <ng-container matColumnDef="disponibles">
    <th mat-header-cell *matHeaderCellDef>DISPONIBLES</th>
    <td mat-cell *matCellDef="let libro"><span class="stock" [class.low]="libro.disponibles <= 5"><span class="stock-circle"></span>{{ libro.disponibles }} uds.</span></td>
  </ng-container>
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>ACCIONES</th>
    <td mat-cell *matCellDef="let libro"><button mat-raised-button color="primary" [routerLink]="['/libro', libro.id]" [attr.aria-label]="'Ver ficha de ' + libro.titulo">Ver ficha ↗</button></td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
</table>
@if (libros.length === 0) {<p class="empty-state">No se encontraron libros con los filtros seleccionados.</p>}
</div>
